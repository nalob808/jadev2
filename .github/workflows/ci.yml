name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  accuracy:
    name: accuracy — golden fixtures vs Swiss Ephemeris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install pyswisseph
      - run: pnpm install --frozen-lockfile

      # Regenerate fixtures from Swiss Ephemeris and fail if they drift.
      # This is the check that keeps Jade honest.
      - name: Regenerate golden fixtures
        run: python3 scripts/generate_fixtures.py --check

      - name: Run accuracy suite
        run: pnpm --filter @jade/astro test
